[package]
name = "glosswork_engine"
version = "2.1.0"
edition = "2024"

[[bin]]
name = "glosswork"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
dialoguer = { version = "0.12.0", features = ["history", "fuzzy-select"] }
directories = "6.0.0"
itertools = "0.15.0"
jieba-rs = "0.11.0"
rayon = "1.12.0"
sanitize-filename = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
simd-json = { version = "0.18.1", features = ["beef"] }
strum = { version = "0.28.0", features = ["derive"] }
toml = "0.9.12"
unicode-normalization = "0.1.25"
path-clean = "1.0.1"
include_dir = "0.7.4"
console = "0.16.6"
bk-tree = "0.5.0"
arboard = "3.6.1"
time = { version = "0.3.55", features = ["macros", "formatting"] }
threadpool = "1.8.1"
num_cpus = "1.17.0"
indicatif = { version = "0.18.6", features = ["rayon"] }
which = "8.0.6"
fancy-regex = "0.19.2"
comrak = "0.55.0"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
