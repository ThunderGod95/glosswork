[package]
name = "tscripts_rs"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "translations_manager"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "wrap_help"] }
dialoguer = { version = "0.12.0", features = ["history", "fuzzy-select"] }
directories = "6.0.0"
itertools = "0.14.0"
jieba-rs = "0.8.1"
rayon = "1.11.0"
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
simd-json = { version = "0.17.0", features = ["beef"] }
strum = { version = "0.27.2", features = ["derive"] }
toml = "0.9.8"
unicode-normalization = "0.1.25"
path-clean = "1.0.1"
include_dir = "0.7.4"
console = "0.16.1"
bk-tree = "0.5.0"
arboard = "3.6.1"
time = { version = "0.3.44", features = ["macros", "formatting"] }
threadpool = "1.8.1"
num_cpus = "1.17.0"
indicatif = { version = "0.18.3", features = ["rayon"] }
which = "8.0.0"
fancy-regex = "0.16.2"
comrak = "0.54.0"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
